name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Backend tests run against real Supabase PostgreSQL database.
# Requires GitHub Secrets: DATABASE_URL (pooler URL for IPv4), SECRET_KEY, SUPABASE_URL, SUPABASE_KEY
#
# IMPORTANT: DATABASE_URL must use the Supabase POOLER connection string (IPv4),
# not the direct connection (IPv6 only). GitHub Actions does not support IPv6.
# Find it at: Supabase Dashboard > Project Settings > Database > Connection string > Session mode
# Format: postgresql://postgres.PROJECT_REF:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres

jobs:
  backend:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: cd backend && pip install -r requirements.txt

      - name: Run tests
        run: cd backend && python -m pytest tests/ -v --tb=short
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing

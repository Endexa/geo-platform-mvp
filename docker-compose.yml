version: '3.8'

# Database is hosted on Supabase (remote PostgreSQL).
# Only Redis runs locally for caching and Celery task broker.
# Set DATABASE_URL in backend/.env to your Supabase connection string.

services:
  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: geo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Worker for background tasks
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geo-celery
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q geo_platform,audit,analysis
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped

  # Nuxt 3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geo-frontend
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      NUXT_PUBLIC_API_BASE: http://backend:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
